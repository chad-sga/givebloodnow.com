<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Give Blood Now | South Bend Medical Foundation</title>
<link rel="icon" type="image/png" href="../sbmf-favicon.png">
<meta http-equiv="refresh" content="0; url=../">
<link rel="canonical" href="https://www.givebloodnow.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --purple:#601066; --orange:#F7931E; --text:#1f1620; --muted:#6b6570; --border:#e6e1e8; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f7f4f8;color:var(--text);font-family:'Montserrat',system-ui,sans-serif;padding:24px}
  .card{background:#fff;border:1px solid var(--border);border-radius:13px;
        box-shadow:0 4px 13px rgba(0,0,0,.04);max-width:520px;padding:34px 32px;text-align:center}
  .sub{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
       border-bottom:2px solid var(--orange);display:inline-block;padding-bottom:10px;margin-bottom:18px}
  h1{font-family:'Roboto Slab',Georgia,serif;font-size:22px;color:var(--purple);margin:0 0 6px}
  p{font-size:14.5px;line-height:1.6;margin:0 0 20px}
  a.btn{display:inline-block;background:var(--purple);color:#fff;text-decoration:none;font-weight:600;
        font-size:14.5px;padding:12px 24px;border-radius:6px}
  a.btn:hover{background:#44094a}
</style>
</head>
<body>
  <div class="card">
    <div class="sub">Now live on the home page</div>
    <h1>September&rsquo;s drive schedule has moved</h1>
    <p>The September schedule is now the main Give Blood Now page. Taking you there&hellip;</p>
    <p><a class="btn" href="../">Go to Give Blood Now</a></p>
  </div>
</body>
</html>
